# Context Path 部署参考：Nginx 反向代理配置
#
# 将 DeepTutor 部署在域名子路径下（如 https://example.com/kaoyan）需要三步：
#
# 1. 构建镜像时传入前端 basePath（烘焙进 Next.js bundle，运行时不可改）：
#
#    docker build --build-arg NEXT_PUBLIC_CONTEXT_PATH=/kaoyan ...
#
#    或在 GitHub Actions 的仓库 Variables 中设置 NEXT_PUBLIC_CONTEXT_PATH=/kaoyan，
#    develop-image.yml 会自动传入构建参数。
#
# 2. 启动容器时设置后端 root_path（运行时环境变量）：
#
#    docker run -e CONTEXT_PATH=/kaoyan ...
#
# 3. 配置 Nginx 反向代理（见下方配置）。
#
# 重要：
# - basePath 是构建时参数，修改后必须重建镜像。运行时设置 system.json 或
#   环境变量无法改变已构建的前端 basePath。
# - CONTEXT_PATH 是运行时参数，只影响后端的 root_path（/docs 页面 URL）。
# - 热部署前端时，本地 NEXT_PUBLIC_CONTEXT_PATH 必须与 Pod 镜像一致，
#   hot-deploy.sh 会自动检查并拦截不匹配的构建。
# - Nginx 不做 strip（不去掉 /kaoyan 前缀），因为 Next.js 需要看到完整路径。
#   Next.js middleware 内部会自动 strip basePath 后再转发给 FastAPI。
# - 不配置前缀时，应用行为与原来完全一致（向后兼容）。

server {
    listen 80;
    server_name example.com;

    # DeepTutor 实例 - 部署在 /kaoyan 子路径下
    location /kaoyan/ {
        proxy_pass http://127.0.0.1:3782/kaoyan/;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 转发真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（WebSocket 长连接 + 大文件上传）
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        client_max_body_size 200M;
    }

    # 如果需要直接访问 FastAPI 的 /docs（可选）
    # location /kaoyan/backend/ {
    #     proxy_pass http://127.0.0.1:8001/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

