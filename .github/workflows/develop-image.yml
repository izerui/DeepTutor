name: Develop Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/develop-image.yml"
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "requirements/**"
      - "requirements.txt"
      - "scripts/**"
      - "web/**"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push production image
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            DEEPTUTOR_REQUIREMENTS_FILE=requirements/deployment.txt
            DEEPTUTOR_BUILD_APT_PACKAGES=cmake libcairo2-dev libpango1.0-dev libffi-dev libegl-dev
            DEEPTUTOR_RUNTIME_APT_PACKAGES=ffmpeg libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libegl1 ghostscript fontconfig fonts-noto-core texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science dvisvgm tipa
            DEEPTUTOR_VERIFY_DEPLOYMENT_EXTRAS=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
            type=gha
            type=registry,ref=${{ steps.image.outputs.name }}:develop
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3,ignore-error=true
